<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonitorInfra Console — mockup</title>
<style>
  :root{
    --bg:#0b0e12; --surface:#10151c; --surface-2:#151c25; --surface-3:#1a2330;
    --line:#202b37; --line-soft:#171f29;
    --ink:#e9eef5; --ink-dim:#98a7b7; --ink-mute:#66768a;
    --accent:#17b8a6; --accent-ink:#04211d;
    --ok:#3ddc97; --warn:#f2b544; --crit:#ef6b6b; --info:#5aa9f5; --neutral:#7e8ea1;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:8px;
  }
  html[data-theme="light"]{
    --bg:#f5f7f9; --surface:#fff; --surface-2:#f1f4f7; --surface-3:#e9eef3;
    --line:#dde4eb; --line-soft:#eaeff4; --ink:#111823; --ink-dim:#4a5766; --ink-mute:#7b8798;
    --accent:#0f8f81; --accent-ink:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#26313d;border-radius:9px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  html[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c8d2dc}

  /* ============ TOP ============ */
  .top{height:52px;display:flex;align-items:center;gap:16px;padding:0 14px;
       border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:15px}
  .brand .sq{width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .brand small{font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:.08em;
               border-left:1px solid var(--line);padding-left:9px;margin-left:2px}
  .modes{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px}
  .modes button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:5px 10px;border-radius:5px;
                color:var(--ink-mute);transition:.12s}
  .modes button:hover{color:var(--ink)}
  .modes button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .grow{flex:1}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-dim);
        border:1px solid var(--line);border-radius:5px;padding:4px 8px;display:flex;align-items:center;gap:7px}
  .chip .live{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .who{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-dim)}
  .who .av{width:26px;height:26px;border-radius:6px;background:var(--surface-3);border:1px solid var(--line);
           display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}

  /* ============ PIPELINE ============ */
  .pipe{height:38px;display:flex;align-items:center;gap:0;padding:0 14px;border-bottom:1px solid var(--line);
        background:var(--surface-2);overflow-x:auto}
  .step{display:flex;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
        color:var(--ink-mute);white-space:nowrap}
  .step b{font-weight:500;padding:4px 9px;border-radius:4px;border:1px solid transparent}
  .step.done b{color:var(--ink-dim);border-color:var(--line)}
  .step.now b{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}
  .step .arw{color:#2b3742;padding:0 3px}
  html[data-theme="light"] .step .arw{color:#c4ced8}
  .pipe .meta{margin-left:auto;padding-left:20px;font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);white-space:nowrap}

  /* ============ SHELL ============ */
  .shell{display:grid;grid-template-columns:196px 1fr;height:calc(100vh - 90px)}
  .rail{border-right:1px solid var(--line);background:var(--surface);padding:10px 8px;overflow-y:auto}
  .rail .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:#4d5b6b;padding:12px 8px 6px}
  .rail button{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:13px;
               color:var(--ink-dim);text-align:left}
  .rail button:hover{background:var(--surface-2);color:var(--ink)}
  .rail button.on{background:var(--surface-3);color:var(--ink);font-weight:500}
  .rail button.on .ic{color:var(--accent)}
  .rail .ic{width:15px;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .rail .badge{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:20px;
               background:color-mix(in oklab,var(--crit) 22%,transparent);color:var(--crit)}
  .rail .badge.w{background:color-mix(in oklab,var(--warn) 20%,transparent);color:var(--warn)}
  main{overflow-y:auto;padding:16px 18px 40px}
  .vhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .vhead h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .vhead p{font-size:12.5px;color:var(--ink-mute)}
  .vhead .right{margin-left:auto;display:flex;gap:7px}

  /* ============ PRIMITIVES ============ */
  .btn{font-size:12.5px;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
       color:var(--ink-dim);font-weight:500;transition:.12s}
  .btn:hover{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));color:var(--ink)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.pri:hover{background:#19c9b5;color:var(--accent-ink)}
  .btn.danger{border-color:color-mix(in oklab,var(--crit) 45%,var(--line));color:var(--crit)}
  .btn.sm{font-size:11.5px;padding:4px 9px;font-family:var(--mono)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .card .ct{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line-soft);
            font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-mute)}
  .card .ct .rt{margin-left:auto;letter-spacing:0;font-size:10.5px}
  .grid{display:grid;gap:13px}
  .sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;border-radius:4px;
       border:1px solid currentColor;white-space:nowrap}
  .sev.crit{color:var(--crit)} .sev.warn{color:var(--warn)} .sev.info{color:var(--info)} .sev.ok{color:var(--ok)}
  .mono{font-family:var(--mono);font-size:11.5px}
  .dim{color:var(--ink-dim)} .mute{color:var(--ink-mute)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:13px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer;
       text-align:left;transition:.12s;position:relative;overflow:hidden}
  .kpi:hover{border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
  .kpi.open{border-color:var(--accent)}
  .kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase}
  .kpi .val{font-family:var(--mono);font-size:21px;font-weight:500;margin-top:5px;letter-spacing:-.02em}
  .kpi .val small{font-size:12px;color:var(--ink-mute);font-weight:400}
  .kpi .sub{font-size:11.5px;color:var(--ink-mute);margin-top:3px}
  .kpi .sub.up{color:var(--crit)} .kpi .sub.dn{color:var(--ok)}
  .kpi .expl{font-size:12.5px;color:var(--ink-dim);margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);
             line-height:1.55}

  /* sparkline */
  .spark{height:26px;margin-top:7px;display:block;width:100%}

  /* feed */
  .feed{display:flex;flex-direction:column}
  .ev{display:grid;grid-template-columns:64px 92px 1fr auto;gap:11px;align-items:start;padding:9px 13px;
      border-bottom:1px solid var(--line-soft);cursor:pointer;width:100%;text-align:left}
  .ev:last-child{border-bottom:none}
  .ev:hover{background:var(--surface-2)}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--ink-mute);padding-top:1px}
  .ev .txt{font-size:13px;color:var(--ink-dim)}
  .ev .txt b{color:var(--ink);font-weight:500}
  .ev .src{font-family:var(--mono);font-size:10px;color:var(--ink-mute);border:1px solid var(--line);
           padding:1px 5px;border-radius:4px;white-space:nowrap}

  /* correlation layout */
  .split{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.35fr);gap:13px;align-items:start}
  .list .it{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line-soft);
            cursor:pointer;text-align:left;width:100%}
  .list .it:last-child{border-bottom:none}
  .list .it:hover{background:var(--surface-2)}
  .list .it.on{background:var(--surface-3);box-shadow:inset 2px 0 0 var(--accent)}
  .list .it .ttl{font-size:13.5px;font-weight:500}
  .list .it .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-top:4px;display:flex;gap:10px}
  .list .it .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .score{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .pane{padding:14px}
  .pane h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
  .pane .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-bottom:13px}
  .blocks{display:flex;flex-direction:column;gap:13px}
  .blk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
  .blk .bh{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-mute);padding:8px 12px;
           border-bottom:1px solid var(--line-soft);text-transform:uppercase}
  .blk .bb{padding:11px 12px}
  .why{font-size:13.5px;color:var(--ink);line-height:1.6}
  .why em{font-style:normal;color:var(--accent);font-family:var(--mono);font-size:12.5px}
  .chain{display:flex;flex-direction:column;gap:0}
  .ch{display:grid;grid-template-columns:20px 1fr;gap:10px;position:relative}
  .ch .dot2{width:8px;height:8px;border-radius:50%;background:var(--info);margin:6px 0 0 6px;z-index:1}
  .ch.sec .dot2{background:var(--crit)} .ch.net .dot2{background:var(--info)} .ch.sys .dot2{background:var(--warn)}
  .ch:not(:last-child)::before{content:'';position:absolute;left:9.5px;top:14px;bottom:-6px;width:1px;background:var(--line)}
  .ch .cb{padding-bottom:11px}
  .ch .cb .hd{font-size:12.5px;font-weight:500}
  .ch .cb .bd{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);margin-top:2px}
  .evid{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim)}
  .evid .r{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:5px 7px;background:var(--bg);border-radius:5px}
  .evid .r span:first-child{color:var(--ink-mute)}
  .reco{border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line));background:color-mix(in oklab,var(--accent) 7%,var(--surface))}
  .reco .bb{font-size:13px;color:var(--ink);line-height:1.6}
  .reco ol{margin:9px 0 0 16px;font-size:12.5px;color:var(--ink-dim)}
  .reco ol li{margin-bottom:3px}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .statenote{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .blast{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .blast .b{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);
            color:var(--ink-dim);background:var(--bg)}
  .blast .b.hi{border-color:color-mix(in oklab,var(--crit) 45%,var(--line));color:var(--crit)}

  /* topology */
  .topo{display:grid;grid-template-columns:1fr 320px;gap:13px;align-items:start}
  svg.graph{width:100%;height:auto;display:block}
  .gnode{cursor:pointer}
  .gnode rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2;transition:.12s}
  .gnode text{fill:var(--ink-dim);font-size:11px;font-family:var(--mono)}
  .gnode text.ty{fill:var(--ink-mute);font-size:9px}
  .gnode:hover rect{stroke:var(--accent)}
  .gnode.on rect{fill:color-mix(in oklab,var(--accent) 16%,var(--surface-2));stroke:var(--accent)}
  .gnode.blast rect{fill:color-mix(in oklab,var(--warn) 13%,var(--surface-2));stroke:color-mix(in oklab,var(--warn) 55%,var(--line))}
  .gedge{stroke:#25313e;stroke-width:1.3;fill:none}
  html[data-theme="light"] .gedge{stroke:#ccd6e0}
  .gedge.hot{stroke:var(--accent);stroke-width:2}
  .gnode .st{fill:var(--ok)}
  .gnode.warn .st{fill:var(--warn)} .gnode.crit .st{fill:var(--crit)}

  /* playbooks */
  .pb{display:grid;grid-template-columns:300px 1fr;gap:13px;align-items:start}
  .pbrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-soft);
         width:100%;text-align:left;cursor:pointer;align-items:center}
  .pbrow:last-child{border-bottom:none}
  .pbrow:hover{background:var(--surface-2)}
  .pbrow.on{background:var(--surface-3);box-shadow:inset 2px 0 0 var(--accent)}
  .pbrow .nm{font-family:var(--mono);font-size:12px;color:var(--accent)}
  .pbrow .ds{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
  .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#4d5b6b;padding:9px 12px 5px;
       border-bottom:1px solid var(--line-soft);background:var(--bg)}
  .term{background:#080b0f;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;overflow:hidden}
  html[data-theme="light"] .term{background:#0d1218}
  .term .th{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:#7c8b9c;
            margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid #18202a}
  .term .th .b{color:#e9eef5}
  .term pre{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:#c6d2de;white-space:pre-wrap;
            word-break:break-word;max-height:270px;overflow-y:auto}
  .term pre .t{color:#5c6b7d} .term pre .cmd{color:#3ddc97} .term pre .k{color:#5aa9f5}
  .term pre .w{color:#f2b544} .term pre .c{color:#ef6b6b} .term pre .ok{color:#3ddc97;font-weight:600}
  .bar2{height:2px;background:#18202a;border-radius:2px;overflow:hidden;margin-top:9px}
  .bar2 i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}

  /* agents */
  .agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
  .agent{padding:13px}
  .agent .hd{display:flex;align-items:center;gap:9px}
  .agent .hd b{font-size:14px;font-weight:600}
  .agent .now{font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:var(--bg);border:1px solid var(--line);
              border-radius:5px;padding:7px 9px;margin-top:11px;line-height:1.6}
  .agent .now u{text-decoration:none;color:var(--accent)}
  .tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tools span{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);border:1px solid var(--line);
              border-radius:4px;padding:1px 6px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim)}
  .kv span:nth-child(odd){color:var(--ink-mute)}

  /* remediation table */
  .rt{width:100%;border-collapse:collapse;font-size:12.5px}
  .rt th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase;
         text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  .rt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-dim);vertical-align:middle}
  .rt tr:hover td{background:var(--surface-2)}
  .flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .flow span{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;
             border:1px solid var(--line);color:var(--ink-mute)}
  .flow span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  /* intelligence */
  .intel{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
  .f{padding:11px 12px}
  .f b{font-family:var(--mono);font-size:12px;font-weight:500;display:block;color:var(--ink)}
  .f .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-top:3px}
  .f p{font-size:12px;color:var(--ink-dim);margin-top:7px}
  .chainviz{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:4px 0}
  .chainviz .n2{font-family:var(--mono);font-size:11px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;
                background:var(--surface-2);color:var(--ink-dim)}
  .chainviz .n2.hi{border-color:var(--accent);color:var(--accent)}
  .chainviz .a2{color:#2b3742;padding:0 7px;font-size:12px}
  html[data-theme="light"] .chainviz .a2{color:#c4ced8}

  /* toast */
  .toast{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--accent);
         border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--ink);max-width:340px;z-index:60;
         box-shadow:0 12px 34px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .toast b{color:var(--accent);font-family:var(--mono);font-size:11.5px;display:block;margin-bottom:3px}
  @media(max-width:1020px){ .split,.topo,.pb{grid-template-columns:1fr} .shell{grid-template-columns:60px 1fr}
    .rail button span.tx{display:none} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="top">
  <div class="brand"><span class="sq"></span> MonitorInfra <small>CONSOLE 0.1</small></div>
  <div class="modes" id="modes"></div>
  <div class="grow"></div>
  <span class="chip"><span class="live"></span> LIVE · PROD-DC-JKT</span>
  <span class="chip" id="clock">--:--:-- WIB</span>
  <div class="who"><span class="av">NS</span><span>noc-shift-2</span></div>
</div>

<div class="pipe" id="pipe"></div>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
</div>

<div class="toast" id="toast"><b>OK</b><span id="toastmsg"></span></div>

<script>
/* ==================================================================
   MonitorInfra console mockup — data contoh
   ================================================================== */
const $ = s => document.querySelector(s);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const STAGES = ['OBSERVE','DISCOVER','DETECT','CORRELATE','DIAGNOSE','RECOMMEND','APPROVE','REMEDIATE','VERIFY'];
const MODES = ['AUTO','NOC','SECURITY','INCIDENT','CAPACITY','CHANGE','AUDIT'];
const MODE_INFO = {
  AUTO:     {note:'Mode adaptif — menyesuaikan diri dengan kondisi aktif.'},
  NOC:      {note:'Fokus availability, latency, packet loss, dan kesehatan device.'},
  SECURITY: {note:'Fokus anomali, vulnerability, autentikasi, dan keamanan jaringan.'},

function sevClass(s){ return s==='crit'?'crit':s==='warn'?'warn':s==='ok'?'ok':'info'; }
function feedInc(f){
  const x = f.txt + ' ' + f.src;
  if(/web-01|packet loss|netflow|nginx/i.test(x) && !/SSH/i.test(x)) return 'INC-2091';

function spark(vals, color){
  const w=150,h=26,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)), h-2-((v-mn)/r)*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+' L'+w+' '+h+' L0 '+h+' Z';
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<path d="'+area+'" style="fill:'+color+';opacity:.10"/>'+
    '<path d="'+d+'" style="fill:none;stroke:'+color+';stroke-width:1.6"/></svg>';
}

function descendants(id){

  walk(id); return out;
}
function vTopology(){
  const sel = S.node, bl = descendants(sel);
  const nm = {}; NODES.forEach(n=>nm[n.id]=n);
  const edges = EDGES.map(e=>{
    const a=nm[e[0]], b=nm[e[1]];
    const hot = (e[0]===sel && bl.includes(e[1]));
    let d;
    if (Math.abs(a.y - b.y) < 8) {           // simpul sebaris: busur di atas baris, bukan melengkung ke bawah
      const dir = (b.x > a.x) ? 1 : -1;
      const x1 = a.x + 62*dir, x2 = b.x - 62*dir;

/* ======================== PLAYBOOK RUNNER ======================== */
function runPlaybook(id){
  if(S.runTimer){ clearInterval(S.runTimer); S.runTimer=null; }
  const pb = PLAYBOOKS.find(p=>p.id===id);
  S.pb = id;
  S.run = {id:id, lines:[pb.steps[0]], done:false, stage:3};
  render();
  let i = 1;
  S.runTimer = setInterval(()=>{
    if(i >= pb.steps.length){
      clearInterval(S.runTimer); S.runTimer=null;
      S.run.done = true;
      S.run.stage = 6;
      render(); toast('Playbook '+pb.id+' selesai — temuan & rekomendasi siap ditinjau.'); return;
    }
    S.run.lines.push(pb.steps[i]);
    if(i===1) S.run.stage = 4;
    if(i===pb.steps.length-1) S.run.stage = 5;
    i++;
    const pre = $('#termpre'), bar = $('#bar2'), st = $('#runst');
    if(pre){
      pre.innerHTML = S.run.lines.map(l=>{
        const cls = l[0]==='cmd'?'cmd':l[0]==='w'?'w':l[0]==='c'?'c':l[0]==='ok'?'ok':l[0]==='t'?'t':'k';
        return '<span class="t">'+(l[2]||'')+'</span> <span class="'+cls+'">'+esc(l[1])+'</span>';
      }).join('\n');
      pre.scrollTop = pre.scrollHeight;
      if(bar) bar.style.width = Math.round(S.run.lines.length/pb.steps.length*100)+'%';
      if(st) st.textContent = 'BERJALAN';
      renderPipe();
    } else { render(); }
  }, 420);
}

/* ======================== RENDER ======================== */
function render(){
  // jaga konsistensi: insiden terpilih harus selalu tampil di daftar mode aktif
  if(S.view==='correlation' && S.mode!=='AUTO'){
    const vis = INCIDENTS.filter(i=>i.mode.includes(S.mode));
    if(vis.length && !vis.some(i=>i.id===S.inc)) S.inc = vis[0].id;
  }
  renderModes(); renderPipe(); renderRail();
  const v = {overview:vOverview, correlation:vCorrelation, topology:vTopology, agents:vAgents,
             playbooks:vPlaybooks, remediation:vRemediation, intelligence:vIntelligence,
             audit:vAudit, design:vDesign}[S.view] || vOverview;
  $('#view').innerHTML = v();
}

  if(!t) return;

  if(d.mode){ S.mode = d.mode; S.openKpi=null; render(); toast('Mode '+d.mode+' aktif — bobot korelasi dan playbook menyesuaikan.'); return; }
  if(d.view){ S.view = d.view; render(); return; }
  if(d.kpi!==undefined && d.kpi!==null && t.classList.contains('kpi')){ const n=+d.kpi; S.openKpi = S.openKpi===n?null:n; render(); return; }
  if(d.feedinc){ S.inc = d.feedinc; S.view='correlation'; render(); return; }
  if(d.feed!==undefined && !d.feedinc){ toast('Peristiwa ini belum terhubung ke insiden mana pun.'); return; }
  if(d.inc){ S.inc = d.inc; S.view='correlation'; render(); return; }
  if(d.node){ S.node = d.node; render(); return; }
  if(d.pb){ runPlaybook(d.pb); return; }
  if(t.id==='theme'){ const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark';
    store.set('mi-theme', r.dataset.theme); toast('Tema '+r.dataset.theme+' (pilihan manual).'); return; }

  if(d.op){ const inc = d.op; const id = t.dataset.rem;
    if(inc==='Apply'){ S.rem[id] = {state:'applied', note:'diterapkan 20:52 WIB · menunggu verifikasi'};
      toast(id+' diterapkan. Verifikasi otomatis dijalankan.'); }
    else if(inc==='Dry run'){ S.rem[id] = {state:'dry', note:'dry run 20:52 WIB · 0 dependensi rusak'};
      toast('Dry run '+id+': 0 dependensi rusak, dampak terhitung.'); }
    else if(inc==='Buat tiket'||inc==='Jadwalkan'){ S.rem[id]= {state:'ticket', note:'tiket CHG-4'+(40+Math.floor(Math.random()*40))+' dibuat'};
      toast('Tiket perubahan dibuat untuk '+id+'.'); }
    else if(inc==='Watchlist'){ S.rem[id]={state:'ignored', note:'sumber masuk watchlist 7 hari'}; toast('Sumber masuk watchlist 7 hari.'); }
    else if(inc==='Blokir'){ S.rem[id]={state:'applied', note:'sumber diblokir di fw-jkt-01'}; toast('Sumber diblokir di fw-jkt-01.'); }
    else { S.rem[id]={state:'ignored', note:'diabaikan oleh operator'}; toast(id+' diabaikan. Alasan dicatat di jejak audit.'); }
    render(); return; }

  if(d.pbapply){ S.togs[d.pbapply]='diterapkan · verifikasi berjalan'; toast('Tindakan diterapkan — verifikasi berjalan di tempat.'); render(); return; }
  if(d.pbdry){ S.togs[d.pbdry]='dry run lulus · 0 dependensi rusak'; toast('Dry run lulus.'); render(); return; }
  if(d.pbticket){ S.togs[d.pbticket]='tiket CHG-4'+(40+Math.floor(Math.random()*40))+' dibuat'; toast('Tiket perubahan dibuat.'); render(); return; }

  if(d.act==='runmode'){ toast('Sweep mode '+S.mode+' dijalankan: 144 device, 88 host, 12 host security.'); return; }
  if(d.act==='agentteam'){ toast('Team mode: 3 agen berjalan paralel, hasil dikorelasikan.'); return; }
  if(d.act==='export'){ toast('Jejak keputusan diekspor ke CSV (mockup).'); return; }
});

/* keyboard: simpul topologi & baris daftar dapat dioperasikan tanpa mouse */
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t = e.target.closest && e.target.closest('[data-node],[data-inc]');
  if(!t) return;
  e.preventDefault();
  t.dispatchEvent(new MouseEvent('click',{bubbles:true}));
});

/* clock */
function clock(){
  const f = new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',
    hour12:false,timeZone:'Asia/Jakarta'}).format(new Date());
  const el=$('#clock'); if(el) el.textContent = f+' WIB';
}
setInterval(clock,1000); clock();

/* init */
const savedT = store.get('mi-theme'); if(savedT) document.documentElement.dataset.theme = savedT;
render();
</script>
