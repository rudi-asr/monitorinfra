<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonitorInfra — Tahap 1: Jaringan</title>
<style>
  :root{
    --bg:#0b0e12; --surface:#10151c; --surface-2:#151c25; --surface-3:#1a2330;
    --line:#202b37; --line-soft:#171f29;
    --ink:#e9eef5; --ink-dim:#9aa8b8; --ink-mute:#66768a;
    --accent:#17b8a6; --accent-ink:#04211d;
    --ok:#3ddc97; --warn:#f2b544; --crit:#ef6b6b; --info:#5aa9f5;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:8px;
  }
  html[data-theme="light"]{
    --bg:#f5f7f9; --surface:#fff; --surface-2:#f1f4f7; --surface-3:#e7edf2;
    --line:#dde4eb; --line-soft:#eaeff4; --ink:#111823; --ink-dim:#4a5766; --ink-mute:#7b8798; --accent-ink:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:none;cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#26313d;border-radius:9px;border:2px solid var(--bg)}

  /* ---------- top ---------- */
  .top{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);
       background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
  .brand .sq{width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--accent);
       border:1px solid color-mix(in oklab,var(--accent) 40%,var(--line));border-radius:5px;padding:3px 8px}
  .grow{flex:1}
  .chip{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);border:1px solid var(--line);
        border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:7px}
  .chip .live{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ---------- nav ---------- */
  .shell{display:grid;grid-template-columns:190px 1fr;height:calc(100vh - 56px)}
  .rail{border-right:1px solid var(--line);background:var(--surface);padding:12px 8px}
  .rail button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
        font-size:13.5px;color:var(--ink-dim);text-align:left;margin-bottom:2px}
  .rail button:hover{background:var(--surface-2);color:var(--ink)}
  .rail button.on{background:var(--surface-3);color:var(--ink);font-weight:500}
  .rail button.on .ic{color:var(--accent)}
  .rail .ic{width:16px;font-family:var(--mono);font-size:12px;color:var(--ink-mute)}
  .rail .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .rail .rule{margin:14px 10px 12px;padding-top:12px;border-top:1px solid var(--line-soft);
        font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);line-height:1.7}
  main{overflow-y:auto;padding:18px 20px 50px}

  /* ---------- summary strip ---------- */
  .verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);
        border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
  .verdict .vmain{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .verdict .vsub{font-size:13px;color:var(--ink-dim);margin-top:5px}
  .counts{margin-left:auto;display:flex;gap:22px}
  .counts .c{text-align:right}
  .counts .c b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1}
  .counts .c span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-mute)}
  .counts .c.ok b{color:var(--ok)} .counts .c.warn b{color:var(--warn)} .counts .c.crit b{color:var(--crit)}

  /* ---------- toolbar ---------- */
  .tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
  .inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;
       color:var(--ink);min-width:210px}
  .inp::placeholder{color:var(--ink-mute)}
  select.inp{min-width:auto;padding-right:8px}
  .tools .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);letter-spacing:.08em}

  /* ---------- table ---------- */
  .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-mute);padding:0 2px 9px;
       display:flex;align-items:center;gap:9px}
  .grp .bar{flex:1;height:1px;background:var(--line-soft)}
  table{width:100%;border-collapse:collapse;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);
        border-radius:var(--r);overflow:hidden}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-mute);text-transform:uppercase;
     text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  td{padding:11px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:13.5px}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--surface-2)}
  tbody tr.on td{background:var(--surface-3)}
  tbody tr:last-child td{border-bottom:none}
  .dev{display:flex;align-items:center;gap:10px}
  .dev .nm{font-weight:500}
  .dev .ty{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute)}
  .dotst{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 8px}
  .dotst.warn{background:var(--warn)} .dotst.crit{background:var(--crit)}
  .num{font-family:var(--mono);font-size:13px}
  .st{font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.crit{color:var(--crit)}
  .empty{padding:26px;text-align:center;color:var(--ink-mute);font-size:13px}

  /* ---------- split + detail ---------- */
  .split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .card .ct{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--ink-mute);
        padding:11px 14px;border-bottom:1px solid var(--line-soft)}
  .pane{padding:14px}
  .pane h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .pane .sub{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin:4px 0 14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
  .kv span:nth-child(odd){color:var(--ink-mute)}
  .kv span:nth-child(even){font-family:var(--mono);font-size:12px}
  .sec{margin-top:15px;padding-top:13px;border-top:1px solid var(--line-soft)}
  .sec .h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-mute);margin-bottom:9px}
  .iface{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px;margin-bottom:9px}
  .iface .n{font-family:var(--mono);font-size:11.5px}
  .iface .n i{font-style:normal;color:var(--ink-mute);font-size:10.5px;margin-left:6px}
  .minibar{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
  .minibar i{display:block;height:100%;background:var(--accent)}
  .minibar i.warn{background:var(--warn)} .minibar i.down{background:var(--crit)}
  .evline{display:grid;grid-template-columns:58px 1fr;gap:9px;font-size:12.5px;color:var(--ink-dim);
        padding:6px 0;border-bottom:1px solid var(--line-soft)}
  .evline:last-child{border-bottom:none}
  .evline b{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-mute)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
  .btn{font-size:12.5px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
       color:var(--ink-dim);font-weight:500}
  .btn:hover{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));color:var(--ink)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.pri:hover{background:#19c9b5}
  .btn.sm{font-size:11.5px;padding:4px 9px;font-family:var(--mono)}
  .note{font-size:12.5px;color:var(--ink-dim);background:var(--bg);border:1px solid var(--line-soft);
        border-radius:6px;padding:9px 11px;margin-top:12px;line-height:1.6}
  .note b{color:var(--accent);font-family:var(--mono);font-size:11.5px;display:block;margin-bottom:4px}

  /* ---------- discovery ---------- */
  .disc{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  .field{margin-bottom:13px}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-mute);
        margin-bottom:6px}
  .field .inp{width:100%}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .chk:last-child{border-bottom:none}
  .chk input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px}
  .chk .t{font-size:13px}
  .chk .d{font-size:11.5px;color:var(--ink-mute);margin-top:2px;line-height:1.5;display:block}
  .dd{font-size:11.5px;color:var(--ink-mute);padding:7px 0 0;line-height:1.5}
  .term{background:#080b0f;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
  .term .th{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;color:#7c8b9c;
        padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid #18202a}
  .term pre{font-family:var(--mono);font-size:11.5px;line-height:1.8;color:#c6d2de;white-space:pre-wrap;
        max-height:280px;overflow-y:auto}
  .term pre .t{color:#5c6b7d} .term pre .k{color:#5aa9f5} .term pre .ok{color:#3ddc97}
  .term pre .w{color:#f2b544} .term pre .c{color:#ef6b6b}
  .how{display:flex;flex-direction:column;gap:0}
  .how .r{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .how .r:last-child{border-bottom:none}
  .how .k{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px}
  .how b{font-size:13.5px;font-weight:500}
  .how .d{font-size:12.5px;color:var(--ink-dim);margin-top:3px;line-height:1.6}
  .how .lim{font-size:11.5px;color:var(--ink-mute);margin-top:4px}
  .found .r{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .found .r:last-child{border-bottom:none}
  .found .mono{font-family:var(--mono);font-size:12px}
  .found .why{font-size:12px;color:var(--ink-mute);margin-top:3px}
  .pill{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);
        color:var(--ink-dim);white-space:nowrap}

  /* ---------- map ---------- */
  .mapwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
  svg.map{width:100%;height:auto;display:block}
  .n{cursor:pointer}
  .n rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.3;rx:8}
  .n .t1{fill:var(--ink);font-size:12px;font-family:var(--mono)}
  .n .t2{fill:var(--ink-mute);font-size:9.5px;font-family:var(--mono)}
  .n:hover rect{stroke:var(--accent)}
  .n.on rect{fill:color-mix(in oklab,var(--accent) 16%,var(--surface-2));stroke:var(--accent)}
  .n.warn rect{stroke:color-mix(in oklab,var(--warn) 60%,var(--line))}
  .n.down rect{stroke:var(--crit);stroke-dasharray:5 4}
  .n .dot{fill:var(--ok)} .n.warn .dot{fill:var(--warn)} .n.down .dot{fill:var(--crit)}
  .lk{stroke:#26313e;stroke-width:1.6;fill:none}
  .lk.on{stroke:var(--accent);stroke-width:2.4}
  .lk.down{stroke:var(--crit);stroke-dasharray:6 5;stroke-width:1.6}
  .lklabel{fill:var(--ink-mute);font-size:9px;font-family:var(--mono)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);
        padding:11px 14px;border-top:1px solid var(--line-soft)}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
  .legend .d{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  .legend .d.warn{background:var(--warn)} .legend .d.crit{background:var(--crit)}

  .toast{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--accent);
        border-radius:8px;padding:11px 14px;font-size:12.5px;max-width:340px;opacity:0;transform:translateY(8px);
        transition:.2s;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.45);z-index:60}
  .toast.on{opacity:1;transform:none}
  .toast b{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:3px}
  @media(max-width:1180px){ .split,.disc,.mapwrap{grid-template-columns:1fr} }
  @media(max-width:860px){ .shell{grid-template-columns:62px 1fr} .rail button span.tx{display:none} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function vPerangkat(){
  const sites = ['Semua', ...new Set(DEVICES.map(d=>d.site))];
  const types = ['Semua', 'Router', 'Switch', 'Firewall', 'Access Point', 'Server jaringan', 'Host'];
  const f = DEVICES.filter(d =>
    (S.ty==='Semua' || d.ty===S.ty) &&
    (S.site==='Semua' || d.site===S.site) &&
    (!S.q || (d.nm+d.ip+d.site+d.ty).toLowerCase().includes(S.q.toLowerCase())));

  const trouble = f.filter(d=>d.st!=='ok');
  const healthy = f.filter(d=>d.st==='ok');
  const total = DEVICES.length;
  const nDown = DEVICES.filter(d=>d.st==='down').length;
  const nWarn = DEVICES.filter(d=>d.st==='warn').length;
  const need = nDown + nWarn;
  const reasons = DEVICES.filter(d=>d.st!=='ok').map(d=>{
    if(d.fresh) return d.nm+' baru ditambahkan, menunggu data pertama';
    if(d.st==='down') return d.nm+' ('+d.site+') diam sejak '+(d.since||'—')+', terakhir terlihat '+(d.last||'—');
    return d.nm+' kehilangan '+d.loss.toFixed(1).replace('.',',')+'% paket; CRC error naik di port uplink';
  });

  const row = d => '<tr data-dev="'+d.id+'" class="'+(S.sel===d.id?'on':'')+'">'+
    '<td><div class="dev"><span class="dotst '+d.st+'"></span><div><div class="nm">'+d.nm+'</div>'+
      '<div class="ty">'+d.ty+'</div></div></div></td>'+
    '<td class="num">'+d.ip+'</td><td>'+d.site+'</td>'+
    '<td class="num">'+(d.lat===null?'—':d.lat.toFixed(1)+' ms')+'</td>'+
    '<td class="num">'+(d.loss===null?'—':d.loss.toFixed(1)+' %')+'</td>'+
    '<td class="num">'+d.ifu+'/'+d.ift+'</td>'+
    '<td><span class="st '+d.st+'"><span class="dotst '+d.st+'"></span>'+stWord(d)+'</span></td></tr>';

  const tbl = rows => rows.length
    ? '<table><thead><tr><th>Perangkat</th><th>Alamat IP</th><th>Lokasi</th><th>Latensi</th>'+
      '<th>Hilang paket</th><th>Interface aktif</th><th>Status</th></tr></thead><tbody>'+
      rows.map(row).join('')+'</tbody></table>'
    : '<div class="card empty">Tidak ada perangkat yang cocok dengan filter ini.</div>';

  return '<div class="verdict"><div><div class="vmain">'+
      (need===0 ? 'Semua perangkat jaringan normal.' : need+' perangkat perlu diperiksa.')+
      '</div><div class="vsub">'+(need? reasons.join(' · ') : 'Tidak ada perangkat yang diam atau kehilangan paket saat ini.')+
      '</div></div>'+
      '<div class="counts">'+
        '<div class="c ok"><b>'+(total-nDown-nWarn)+'</b><span>NORMAL</span></div>'+
        '<div class="c warn"><b>'+nWarn+'</b><span>PERHATIAN</span></div>'+
        '<div class="c crit"><b>'+nDown+'</b><span>DIAM</span></div>'+
      '</div></div>'+

    '<div class="tools">'+
      '<input class="inp" id="q" placeholder="Cari nama, IP, lokasi…" value="'+esc(S.q)+'">'+
      '<select class="inp" id="fty">'+types.map(t=>'<option'+(t===S.ty?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
      '<select class="inp" id="fsite">'+sites.map(t=>'<option'+(t===S.site?' selected':'')+'>'+t+'</option>').join('')+'</select>'+

    '</div>'+

    (trouble.length? '<div class="grp">PERLU PERHATIAN <span class="bar"></span></div>'+tbl(trouble) : '')+
    '<div class="grp">NORMAL <span class="bar"></span></div>'+tbl(healthy)+

    (S.sel && dev(S.sel) ? detail() : '');
}

        '<div class="kv" style="margin-top:9px"><span>Sekarang</span><span>'+
        (d.lat===null?'—':d.lat.toFixed(1)+' ms')+'</span><span>Hilang paket</span><span>'+
        (d.loss===null?'—':d.loss.toFixed(1)+' %')+'</span></div>'+
        (d.st==='warn'?'<div class="note"><b>Catatan</b>Latensi naik dari 1,1 ms ke 14,8 ms sejak 19:58 dan diikuti CRC error pada port uplink. Pola ini biasanya masalah kabel atau SFP, bukan beban trafik.</div>':'')+
      '</div>'+

      '<div class="acts"><button class="btn pri" data-act="check" data-id="'+d.id+'">Cek sekarang</button>'+

    .map(l=>{ const o = l[0]===S.node?l[1]:l[0]; return {o:o, sp:l[2], st:(nm[o].st||'ok')}; });

  return '<div class="mapwrap">'+
    '<div class="card"><div class="ct">PETA KONEKSI — sumber: LLDP/CDP + tabel MAC switch</div>'+
      '<div class="pane" style="padding:10px"><svg class="map" viewBox="0 0 1140 520">'+links+nodes+'</svg></div>'+
      '<div class="legend">'+
        '<i><span class="d"></span> normal</i><i><span class="d warn"></span> perlu perhatian</i>'+
        '<i><span class="d crit"></span> tidak merespons</i>'+
        '<i>garis putus-putus = tautan ke perangkat yang diam</i>'+
        '<i>klik simpul untuk melihat tautannya</i>'+
      '</div></div>'+
    '<div class="card"><div class="ct">SIMPUL TERPILIH</div><div class="pane">'+
      '<h3>'+sel.t1+'</h3><div class="sub">'+sel.t2+'</div>'+
      '<div class="sec" style="margin-top:0;border-top:none;padding-top:0"><div class="h">TAUTAN ('+neigh.length+')</div>'+
        (neigh.length? neigh.map(n=>'<div class="evline"><b>'+n.sp+'</b><span>'+n.o+
          (n.st==='down'?' <span class="st crit">diam</span>':n.st==='warn'?' <span class="st warn">perlu perhatian</span>':'')+
          '</span></div>').join('') : '<div class="note" style="margin:0">Simpul ini adalah titik akhir — tidak punya tautan ke perangkat jaringan lain.</div>')+
      '</div>'+
      (dev(sel.t1)? '<div class="acts"><button class="btn pri" data-open="'+sel.t1+'">Lihat detail perangkat →</button></div>'
        : '<div class="note" style="margin-top:14px"><b>Grup</b>Beberapa perangkat digabung jadi satu simpul agar peta tetap terbaca. Buka daftar Perangkat untuk melihat satuannya.</div>')+
    '</div></div></div>';
}

/* ---------------- render ---------------- */
function renderRail(){
  $('#rail').innerHTML = RAIL.map(n=>'<button class="'+(S.view===n.id?'on':'')+'" data-view="'+n.id+'">'+
    '<span class="ic">'+n.ic+'</span><span class="tx">'+n.tx+'</span><span class="n">'+
    (n.id==='perangkat'?DEVICES.length:(n.n||''))+'</span></button>').join('')+
    '<div class="rule">Yang dipantau tahap ini hanya perangkat jaringan: router, switch, firewall, access point, dan server jaringan.</div>'+
    '<div class="rule" style="border:none;padding-top:0;margin-top:0">Server aplikasi, container, dan security belum masuk.</div>';
}
function render(){
  renderRail();
  $('#view').innerHTML = {perangkat:vPerangkat, penemuan:vPenemuan, peta:vPeta}[S.view]();
}

/* ---------------- events ---------------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-view],[data-dev],[data-node],[data-add],[data-skip],[data-act],[data-open]');
  if(!t) return;
  const d = t.dataset;
  if(d.view){ S.view=d.view; render(); return; }
  if(d.dev){ S.sel=d.dev; render(); return; }
  if(d.node){ S.node=d.node; render(); return; }
  if(d.open){ S.sel=d.open; S.view='perangkat'; render(); toast('Detail '+d.open+' dibuka.'); return; }
  if(d.add){
    if(!S.added[d.add]){
      const info = DISCOVERED_NEW.find(x=>x.ip===d.add) || {guess:'Belum diketahui', mac:'—'};
      const guessTy = {'Access Point (kandidat)':'Access Point','Host / perangkat kecil':'Host','Server / host':'Host',
                       'Belum diketahui':'Host','Router (kandidat)':'Router','Perangkat jaringan (kandidat)':'Switch'};
      const pre = {'Router':'rt','Switch':'sw','Access Point':'ap','Host':'host'};
      const ty = guessTy[info.guess] || 'Host';
      const oct = String(d.add).split('.').slice(-2).join('-');
      S.added[d.add] = 'add';
      DEVICES.push({id:d.add, nm:pre[ty]+'-baru-'+oct, ty:ty, ip:d.add, site:'Jakarta', lat:null, loss:null,
        ifu:0, ift:1, up:'—', st:'warn', fresh:true, vend:'Belum diketahui', mdl:'—', fw:'—', snmp:'none',
        src:'penemuan: ICMP/ARP, MAC '+info.mac, ev:[['sekarang','Ditambahkan dari hasil penemuan — menunggu polling pertama']]});
      render();
      toast(d.add+' ditambahkan sebagai '+pre[ty]+'-baru-'+oct+' (status: menunggu data pertama).');
    }
    return;
  }
  if(d.skip){ S.added[d.skip]='skip'; render(); toast(d.skip+' diabaikan — tidak akan ditanyakan lagi.'); return; }
  if(d.act==='check'){ toast('Pemeriksaan ulang dijalankan untuk '+d.id+' (ping + SNMP).'); return; }
  if(d.act==='mute'){ toast('Peringatan '+d.id+' disenyapkan 1 jam.'); return; }
  if(d.act==='map'){ S.view='peta'; render(); return; }
  if(d.act==='scan'){ runScan(); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t = e.target.closest && e.target.closest('[data-node],[data-dev]');
  if(!t) return; e.preventDefault(); t.dispatchEvent(new MouseEvent('click',{bubbles:true}));
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q=e.target.value; const p=e.target.selectionStart; render();
    const el=$('#q'); if(el){ el.focus(); el.setSelectionRange(p,p); } }
});
document.addEventListener('change', e=>{
  if(e.target.id==='fty'){ S.ty=e.target.value; render(); }
  if(e.target.id==='fsite'){ S.site=e.target.value; render(); }
});

function runScan(){
  if(S.scanTimer){ clearInterval(S.scanTimer); S.scanTimer=null; }
  S.scan = {lines:[SCAN[0]], done:false};
  render();
  let i=1;
  S.scanTimer = setInterval(()=>{
    if(i>=SCAN.length){
      clearInterval(S.scanTimer); S.scanTimer=null; S.scan.done=true; render();
      toast('Penemuan selesai: 138 perangkat diperbarui, 6 menunggu kredensial.'); return;
    }
    S.scan.lines.push(SCAN[i]);
    const pre=$('#scanpre'), bar=$('#scanbar'), st=$('#scanst');
    if(pre){
      pre.innerHTML = S.scan.lines.map(l=>'<span class="t">'+l[1]+'</span> <span class="'+l[0]+'">'+esc(l[2])+'</span>').join('\n');
      pre.scrollTop = pre.scrollHeight;
      if(bar) bar.style.width = Math.round(S.scan.lines.length/SCAN.length*100)+'%';
      if(st) st.textContent='BERJALAN';
    } else { render(); }
    i++;
  }, 480);
}

function clock(){
  const f = new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,
    timeZone:'Asia/Jakarta'}).format(new Date());
  const el=$('#clock'); if(el) el.textContent=f+' WIB';
}
setInterval(clock,1000); clock();
const savedT = store.get('mi-theme'); if(savedT) document.documentElement.dataset.theme = savedT;
render();
</script>
</body>
</html>
